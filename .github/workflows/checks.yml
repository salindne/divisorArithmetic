name: checks

# Static checks only. Magma cannot run here and never will: it is commercial
# software distributed as a licensed tarball that must not be committed or pushed
# to a registry, and it exits 0 even when an assertion fails, so it could not
# gate on exit status even on a self-hosted runner. The semantic gate for the
# formulas is a Python verification framework, added separately; this workflow
# covers everything that can be checked without Magma.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-lint:
    # Catches syntax errors, undefined names, Python-2-isms and invalid escape
    # sequences. The ruleset is deliberately narrow: this repository contains
    # research scripts that are not going to be restyled, so only real defects
    # are selected.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: ruff
        run: |
          pip install --quiet ruff
          ruff check --select E9,F63,F7,F82,F821,W605 --exclude rust .
      - name: compile with SyntaxWarning as error
        run: |
          python -W error::SyntaxWarning -m compileall -q \
            $(git ls-files '*.py' | grep -v '^rust/')

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Every tracked shell script, so a new one cannot be added unchecked.
          mapfile -t scripts < <(git ls-files '*.sh' | grep -v '^rust/')
          printf 'checking: %s\n' "${scripts[@]}"
          shellcheck -S warning "${scripts[@]}"

  path-integrity:
    # Stale paths are the largest class of defect in this repository: broken
    # `load` statements and broken `open()` calls, several of which silently
    # disabled whole tools. Known-broken ones are declared in
    # tools/known_broken_paths.txt; anything new fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 tools/check_paths.py --strict

  readme-paths:
    # The previous README named a tester that had never existed, gave three
    # filenames wrong and two directories wrong. Note this job is the authority
    # on filename casing: macOS is case-insensitive, so a casing error passes on
    # a developer machine and only fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 tools/check_readme_paths.py

  harness-selftest:
    # test_all.sh could not fail: it checked no exit status, grepped no output,
    # and ended in an echo. This proves the replacement actually detects failure,
    # using a fake Magma so it needs no licence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - run: tools/tests/run.sh

  verify-formulas:
    # The first job in this workflow that checks the formulas themselves rather
    # than the repository around them. Everything above is a static check by
    # construction; this one runs the real .mag source through an interpreter and
    # compares it against an independent implementation of the group law.
    #
    # Two jobs rather than one, because they answer different questions and a
    # failure in either should be readable on its own:
    #
    #   selftest  is the framework trustworthy? Group axioms, the empirical curve
    #             filter against the textbook singularity criterion, three-way
    #             agreement between the reference and two independent
    #             implementations, and the recorded errata as required test
    #             vectors. If this fails, nothing the next step says means anything.
    #
    #   whitebox  do the formulas agree with the reference on every one of their
    #             computation paths? Constructed cases only, so it is deterministic
    #             and can gate on coverage.
    #
    # driver.py is deliberately NOT here. It is the random differential tester, and
    # at CI volume it is neither a real correctness check nor a coverage gate -- the
    # defects it is good at finding were found by exhaustive enumeration over
    # millions of pairs, not by a 37-second sample. It stays a local and pre-release
    # tool, documented in verification/README.md.
    #
    # Pure standard library, so there is no install step and no dependency to
    # break. That is what makes this job possible at all: Magma is licensed and
    # cannot run on a hosted runner, so before this landed no CI job could verify
    # a formula.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false

      - name: framework selftest
        working-directory: verification
        # The `reference` and `repros` sections need the audit artefacts, which are
        # deliberately outside this repository. They report themselves as skipped
        # here rather than being silently dropped.
        run: python3 selftest.py --quick

      - name: constructed whitebox cases, every developed formula
        working-directory: verification
        # 1,802 frozen cases, one per computation path, found by coverage-guided
        # search and then committed -- not hand-built. Replayed
        # through the interpreter and compared against reference.py. Deterministic and
        # about two seconds.
        #
        # This is the gate rather than random sampling because sampling coverage is
        # coupon-collector: 54% at CI volume, 84% after twelve minutes, and it stalls.
        # It could never gate on coverage without either failing honest runs or gating
        # on nothing.
        #
        # 1,338 cases are read at run time out of the repository's own whitebox
        # testers, so they cannot drift out of step with them, and those files are held
        # to 100% coverage. The remaining 344 are for the three families that have no
        # tester, harvested once offline into harvested_cases.json. Expected coverage
        # lives in coverage_baseline.json as a NAMED label set -- what is exempt, with
        # the reason -- so a newly added branch fails by default and branches cannot
        # be traded one-for-one. All three developed genus-3 ramified files are at
        # 100%. Nothing here samples.
        run: python3 whitebox.py
